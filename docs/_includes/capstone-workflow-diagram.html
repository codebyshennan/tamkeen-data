<figure class="html-diagram html-diagram--capstone" aria-labelledby="capstone-workflow-title">
<figcaption id="capstone-workflow-title">Capstone workflow: move from a practical question to reproducible evidence, then to a stakeholder recommendation.</figcaption>
<ol class="html-diagram__steps">
  <li><strong>Frame the problem</strong><span>Define the stakeholder, question, expected decision, and success measure.</span></li>
  <li><strong>Build the data foundation</strong><span>Collect the data, document the source, clean the fields, and show row-count checks.</span></li>
  <li><strong>Explore and explain</strong><span>Use summary tables and charts to understand patterns, risks, and missing context.</span></li>
  <li><strong>Model only when useful</strong><span>Start with a baseline, choose the right metric, and report output logs or charts that support the score.</span></li>
  <li><strong>Communicate the decision</strong><span>Turn the technical evidence into a recommendation, limitation, and next step.</span></li>
</ol>
</figure>
